name: Validate PRs

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      - name: Run Biome
        run: biome ci .
  e2e:
    name: Run e2e tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
      - name: Generate an ephemeral test secret
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "BETTER_AUTH_SECRET=" + require("node:crypto").randomBytes(32).toString("hex") + "\n")'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare test database
        run: pnpm --filter @repo/database generate && pnpm --filter @repo/database push
      - name: Run Playwright tests
        run: pnpm --filter @repo/web e2e:ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
